  - title: Supported Versions
    content: 'This repository contains documentation and educational content.

      There are no executable components or deployed services associated with this
      project.


      The `master` branch reflects the latest maintained version of the documentation.


      | Version | Supported |

      |--------|-----------|

      | master | ✅ |

      | Others | ❌ |


      ---'
  - title: Security Best Practices for Contributors
    content: '- Do not include secrets, tokens, or credentials in documentation or
      workflows

      - Avoid using user-controlled input in CI/CD pipelines without validation

      - Follow the OWASP Cheat Sheet Series for secure development and governance
      practices


      ---'
  - title: Recognition
    content: 'Security researchers and contributors who responsibly disclose issues
      may be acknowledged

      in release notes or project documentation, unless anonymity is requested.'
