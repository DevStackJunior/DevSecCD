  reporting:
  - title: Reporting a Vulnerability
    content: 'This repository does **not** directly process user data, authentication,
      or runtime execution.

      However, if you believe you have identified:


      - A security issue affecting linked tooling or referenced examples

      - A misconfiguration that could lead to unsafe usage patterns

      - A vulnerability related to CI/CD workflows or repository automation


      Please follow **responsible disclosure** practices.'
  - title: How to Report
    content: '- Open a **private GitHub Security Advisory** for this repository, **or**

      - Contact the OWASP project maintainers through official OWASP communication
      channels


      Please include:

      - A clear description of the issue

      - Steps to reproduce (if applicable)

      - Potential impact

      - Suggested remediation (if available)


      ---'
